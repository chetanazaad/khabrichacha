# Keyword patterns for heuristic classification
classification:
  fast_patterns:
    math: "^[\\d\\s\\+\\-\\*\\/\\.\\(\\)]+$"
    fact_prefixes:
      - "capital of"
      - "who is the president"
      - "who is the prime minister"
      - "what is the formula"
      - "define "
      - "meaning of "
      - "what does .* mean"
    programming:
      - "python syntax"
      - "how to print in"
      - "javascript function"
      - "http status code"
      - "html tag for"

  lookup_keywords:
    - "latest"
    - "current"
    - "today"
    - "price of"
    - "weather in"
    - "score of"
    - "ceo of"

  structured_keywords:
    - "budget"
    - "gdp"
    - "population"
    - "election results"
    - "financial statement"
    - "statistics"
    - "data"
    - "table"
    - "figures"
    - "annual report"

  comparison_patterns:
    - " vs "
    - " versus "
    - "compare"
    - "comparison"
    - "difference between"
    - "better than"

  analysis_keywords:
    - "explain"
    - "why did"
    - "why is"
    - "why has"
    - "how does"
    - "impact of"
    - "effect of"
    - "reason for"
    - "cause of"

  research_keywords:
    - "analyze"
    - "research"
    - "history of"
    - "evaluate"
    - "assess"
    - "examine"
    - "review"
    - "study"

  deep_research_keywords:
    - "investigate"
    - "deep dive"
    - "comprehensive analysis"
    - "root cause"
    - "behind the news"
    - "corporate investigation"
    - "geopolitical analysis"

  escalation_thresholds:
    fast_to_lookup: 0.90
    lookup_to_structured: 0.80
    structured_to_comparison: 0.60
    comparison_to_analysis: 0.70
    analysis_to_research: 0.60
    research_to_deep: 0.65
