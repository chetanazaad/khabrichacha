# ============================================================
# KhabriChacha — Base Configuration
# All environment overrides merge on top of this file.
# ============================================================

app:
  name: "KhabriChacha"
  version: "1.0.0"
  schema_version: "1.0"

# --- Workspace ---
workspace:
  root: "./workspace"           # overridden per environment

# --- Server ---
server:
  host: "127.0.0.1"
  port: 8080
  reload: false
  dark: true

# --- LLM Defaults ---
llm:
  default_provider: "gemini"
  temperature: 0.7
  max_tokens: 2048
  system_prompt: >-
    You are Khabri Chacha, an intelligent, helpful agent assistant.
    Act as a coordinator and solve user queries step by step.

# --- Research Defaults ---
research:
  depth: "standard"
  max_iterations: 5
  max_runtime_minutes: 15
  max_sources: 10
  parallel_fetch: 10
  language: "English"
  output_formats:
    - "md"
    - "json"
    - "pdf"

# --- Browser ---
browser:
  playwright: true
  chromium: true
  timeout: 30

# --- Logging ---
logging:
  level: "INFO"
  file: true
