[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "khabrichacha"
version = "0.1.0"
description = "AI Powered Deep Research Framework"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=2.0.0",
    "uvicorn>=0.28.0",
    "watchdog>=4.0.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "openai>=1.12.0",
    "google-generativeai>=0.4.0",
    "ddgs>=9.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "lxml>=4.9.0",
    "PyMuPDF>=1.23.0",
    "feedparser>=6.0.10",
    "playwright>=1.42.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.1",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
# Only needed for the local Hugging Face ("transformers") provider. The
# recommended free/local path is Ollama, which needs no extra Python
# packages -- just the Ollama app + `ollama pull qwen2.5:3b`.
local-llm = ["transformers>=4.38.0", "torch>=2.2.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
khabrichacha = "app:main"

[tool.setuptools.packages.find]
include = ["khabrichacha*", "deployment*"]

[tool.setuptools.package-data]
"deployment" = ["*.yaml"]
